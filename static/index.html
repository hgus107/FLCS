<!-- Chat box. Sends the question plus a session id to /ask and shows the thread. -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>FLCS Agent</title>
  <style>
    body { font: 15px/1.6 -apple-system, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
    #thread { margin: 24px 0; }
    .turn { padding: 12px 0; border-top: 1px solid #eee; }
    .who { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #888; }
    .body { white-space: pre-wrap; margin-top: 4px; }
    #q { width: 100%; padding: 10px; font-size: 15px; font-family: inherit; resize: vertical; }
    button { margin-top: 8px; padding: 8px 18px; font-size: 15px; }
    #reset { background: none; border: none; color: #888; text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <h2>FLCS — Fraud, Loan, Compliance &amp; Support</h2>

  <textarea id="q" rows="5" placeholder="Ask about fraud / lending / compliance / support
 - run the latest fraud scan
 - list all pending loan applications
 - run a compliance scan across pending card applications
 - what is our policy on disputed transactions?"></textarea>

  <button id="go">Ask</button>
  <button id="reset">New conversation</button>

  <div id="thread"></div>

  <script>
    let sid = sessionStorage.getItem("sid");
    if (!sid) {
      sid = Math.random().toString(36).slice(2);
      sessionStorage.setItem("sid", sid);
    }

    const thread = document.getElementById("thread");
    const box = document.getElementById("q");

    function add(who, text) {
      const div = document.createElement("div");
      div.className = "turn";
      div.innerHTML = `<div class="who"></div><div class="body"></div>`;
      div.querySelector(".who").textContent = who;
      div.querySelector(".body").textContent = text;
      thread.prepend(div);
      return div;
    }

    async function ask() {
      const question = box.value.trim();
      if (!question) return;
      box.value = "";
      add("You", question);
      const pending = add("Agent", "Thinking...");

      const res = await fetch("/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, session_id: sid }),
      });

      const data = await res.json();
      pending.querySelector(".body").textContent = data.answer;
    }

    document.getElementById("go").onclick = ask;

    box.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
    });

    document.getElementById("reset").onclick = async () => {
      await fetch("/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sid }),
      });
      thread.innerHTML = "";
    };
  </script>
</body>
</html>
